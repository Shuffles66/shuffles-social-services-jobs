<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1112" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Workflow: applying as a candidate to a TFN job">
  <defs>
    <filter id="sh" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .card{ fill:#ffffff; stroke:#e2e8f0; stroke-width:1.5; filter:url(#sh); }
      .num{ fill:#0e7490; }
      .numt{ fill:#ffffff; font-size:20px; font-weight:700; text-anchor:middle; }
      .ttl{ fill:#0f172a; font-size:18px; font-weight:700; }
      .dsc{ fill:#475569; font-size:13px; }
      .htitle{ fill:#ffffff; font-size:22px; font-weight:800; text-anchor:middle; }
      .hsub{ fill:#cffafe; font-size:13px; text-anchor:middle; }
      .foot{ fill:#94a3b8; font-size:12px; text-anchor:middle; }
    </style>
  </defs>

  <rect width="880" height="1112" fill="#f8fafc"/>

  <!-- Header band -->
  <rect x="80" y="24" width="720" height="72" rx="14" fill="#0e7490"/>
  <text class="htitle" x="440" y="58">Applying as a candidate to a TFN job</text>
  <text class="hsub" x="440" y="80">Employee position (PAYG) — wages with tax withheld, no ABN needed</text>

  <!-- Step 1 -->
  <rect class="card" x="80" y="120" width="720" height="84" rx="14"/>
  <circle class="num" cx="128" cy="162" r="22"/><text class="numt" x="128" y="169">1</text>
  <text class="ttl" x="186" y="156">Create your candidate profile</text>
  <text class="dsc" x="186" y="180">Add your skills, availability, location and a profile photo.</text>
  <line x1="440" y1="210" x2="440" y2="228" stroke="#0e7490" stroke-width="3"/><polygon points="440,236 433,226 447,226" fill="#0e7490"/>

  <!-- Step 2 -->
  <rect class="card" x="80" y="238" width="720" height="84" rx="14"/>
  <circle class="num" cx="128" cy="280" r="22"/><text class="numt" x="128" y="287">2</text>
  <text class="ttl" x="186" y="274">Add your checks</text>
  <text class="dsc" x="186" y="298">WWCC, police check, First Aid → green &#10003; Verified. No ABN needed.</text>
  <line x1="440" y1="328" x2="440" y2="346" stroke="#0e7490" stroke-width="3"/><polygon points="440,354 433,344 447,344" fill="#0e7490"/>

  <!-- Step 3 -->
  <rect class="card" x="80" y="356" width="720" height="84" rx="14"/>
  <circle class="num" cx="128" cy="398" r="22"/><text class="numt" x="128" y="405">3</text>
  <text class="ttl" x="186" y="392">Browse jobs</text>
  <text class="dsc" x="186" y="416">Open the Jobs / TFN board; filter by category, location and radius.</text>
  <line x1="440" y1="446" x2="440" y2="464" stroke="#0e7490" stroke-width="3"/><polygon points="440,472 433,462 447,462" fill="#0e7490"/>

  <!-- Step 4 -->
  <rect class="card" x="80" y="474" width="720" height="84" rx="14"/>
  <circle class="num" cx="128" cy="516" r="22"/><text class="numt" x="128" y="523">4</text>
  <text class="ttl" x="186" y="510">Apply</text>
  <text class="dsc" x="186" y="534">Send a short cover note — apply once per job.</text>
  <line x1="440" y1="564" x2="440" y2="582" stroke="#0e7490" stroke-width="3"/><polygon points="440,590 433,580 447,580" fill="#0e7490"/>

  <!-- Step 5 -->
  <rect class="card" x="80" y="592" width="720" height="84" rx="14"/>
  <circle class="num" cx="128" cy="634" r="22"/><text class="numt" x="128" y="641">5</text>
  <text class="ttl" x="186" y="628">Advertiser reviews</text>
  <text class="dsc" x="186" y="652">The employer shortlists applicants in their dashboard.</text>
  <line x1="440" y1="682" x2="440" y2="700" stroke="#0e7490" stroke-width="3"/><polygon points="440,708 433,698 447,698" fill="#0e7490"/>

  <!-- Step 6 -->
  <rect class="card" x="80" y="710" width="720" height="84" rx="14"/>
  <circle class="num" cx="128" cy="752" r="22"/><text class="numt" x="128" y="759">6</text>
  <text class="ttl" x="186" y="746">Message securely</text>
  <text class="dsc" x="186" y="770">Chat through the site&#8217;s private relay — your contact details stay protected.</text>
  <line x1="440" y1="800" x2="440" y2="818" stroke="#0e7490" stroke-width="3"/><polygon points="440,826 433,816 447,816" fill="#0e7490"/>

  <!-- Step 7 -->
  <rect class="card" x="80" y="828" width="720" height="84" rx="14"/>
  <circle class="num" cx="128" cy="870" r="22"/><text class="numt" x="128" y="877">7</text>
  <text class="ttl" x="186" y="864">Interview &amp; offer</text>
  <text class="dsc" x="186" y="888">The employer interviews and makes an offer.</text>
  <line x1="440" y1="918" x2="440" y2="936" stroke="#0e7490" stroke-width="3"/><polygon points="440,944 433,934 447,934" fill="#0e7490"/>

  <!-- Step 8 -->
  <rect class="card" x="80" y="946" width="720" height="84" rx="14"/>
  <circle class="num" cx="128" cy="988" r="22"/><text class="numt" x="128" y="995">8</text>
  <text class="ttl" x="186" y="982">Hired as an employee</text>
  <text class="dsc" x="186" y="1006">Start on wages with tax withheld (PAYG) — no ABN required.</text>

  <text class="foot" x="440" y="1072">Shuffles — Social Services Jobs &amp; Engagements   ·   TFN employment pathway</text>
</svg>
